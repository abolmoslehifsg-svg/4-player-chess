<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>شطرنج — بازی کن</title>
<script>
(async function () {
  try {
    // Last known good full HTML commit
    const res = await fetch('https://cdn.jsdelivr.net/gh/abolmoslehifsg-svg/4-player-chess@e2d79722eab8d5a69a3105cd1afc839143ac7319/index.html');
    let html = await res.text();
    // Force local styles + mobile-fix so we can iterate without CDN lag
    html = html.replace(
      /<link rel="stylesheet" href="styles\.css">/,
      '<link rel="stylesheet" href="styles.css">\n<link rel="stylesheet" href="mobile-fix.css">'
    );
    html = html.replace(
      'content="width=device-width, initial-scale=1.0"',
      'content="width=device-width, initial-scale=1.0, viewport-fit=cover"'
    );
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px;direction:rtl;max-width:480px;margin:40px auto;line-height:1.8">خطا در بارگذاری بازی.<br>صفحه را رفرش کنید یا اتصال اینترنت را بررسی کنید.<br><br><small style="opacity:.7">' + (e && e.message ? e.message : e) + '</small></p>';
    console.error(e);
  }
})();
</script>
</head>
<body style="margin:0;background:#14161c;color:#e9e6dd;font-family:sans-serif;padding:24px;direction:rtl">
در حال بارگذاری بازی…
</body>
</html>
